<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42" />
    </filter>
    <filter id="cloud" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0055" numOctaves="4" seed="11" />
      <feColorMatrix
        type="matrix"
        values="0 0 0 0 0.92  0 0 0 0 0.92  0 0 0 0 0.92  0 0 0 1.15 0"
      />
      <feGaussianBlur stdDeviation="32" />
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#080808" />
  <rect width="1440" height="900" filter="url(#cloud)" opacity="0.62" />
  <ellipse cx="260" cy="620" rx="380" ry="290" fill="#ffffff" filter="url(#soft)" opacity="0.96" />
  <ellipse cx="980" cy="220" rx="340" ry="260" fill="#ffffff" filter="url(#soft)" opacity="0.9" />
  <ellipse cx="720" cy="760" rx="420" ry="220" fill="#ffffff" filter="url(#soft)" opacity="0.88" />
  <ellipse cx="520" cy="280" rx="260" ry="320" fill="#ffffff" filter="url(#soft)" opacity="0.82" />
  <ellipse cx="1180" cy="680" rx="240" ry="200" fill="#ffffff" filter="url(#soft)" opacity="0.78" />
</svg>
